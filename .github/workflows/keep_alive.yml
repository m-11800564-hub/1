name: Streamlit Keep-Alive Ping

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Wake Up Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          url = 'https://hwffymufoayjcxt8kxw2s5.streamlit.app'
          print(f'Visiting {url}...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, timeout=60000)
              
              time.sleep(5)
              
              # Check for the Wake Up button and click it if found
              try:
                  wake_button = page.get_by_role('button', name='Yes, get this app back up!')
                  if wake_button.is_visible():
                      print('App was sleeping. Clicking wake up button...')
                      wake_button.click()
                      time.sleep(15)
                  else:
                      print('App is already awake!')
              except Exception as e:
                  print('App is already awake or button not present.')

              browser.close()
          "
